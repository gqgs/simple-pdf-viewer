[package]
name = "simple-pdf-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
blake3 = "1.8"
cairo-rs = "0.22"
crossbeam-channel = "0.5"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
glib = "0.22"
poppler-rs = "0.26"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true

